[package]
name = "pi-vm"
version = "0.1.0"
edition = "2024"
description = "docker-like CLI for the pi VM sandbox (Cloud Hypervisor + virtiofsd)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rand = "0.10"
fs2 = "0.4"
signal-hook = "0.4"

[profile.release]
strip = true
